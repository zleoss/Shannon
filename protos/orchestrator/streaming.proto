// =============================================================================
// 文件: protos/orchestrator/streaming.proto
// -----------------------------------------------------------------------------
// 【一句话功能】
//   定义 orchestrator 的流式执行订阅接口 StreamingService，供客户端通过
//   gRPC server-stream 实时消费工作流事件，并支持断点续传。
// 【关键 message / service】
//   service StreamingService: 1 个 RPC ——
//     StreamTaskExecution(StreamRequest) returns (stream TaskUpdate)
//   message StreamRequest: workflow_id / types(事件类型过滤，可空) /
//     last_event_id(旧版兼容，exclusive 续传点) /
//     last_stream_id(新版 Redis Stream ID，推荐使用)
//   message TaskUpdate: workflow_id / type / agent_id / message /
//     timestamp / seq(旧版兼容) / stream_id(Redis Stream ID，稳健续传)
// 【由谁实现 / 由谁调用】
//   实现: Go orchestrator；配套 Redis Stream 作为事件后端（ring_capacity
//     由 config/shannon.yaml 的 streaming.ring_capacity 配置）
//   调用: Go gateway，将流转换为对外 SSE（/api/v1/tasks/stream 等）
// =============================================================================
syntax = "proto3";

package shannon.orchestrator;
option go_package = "github.com/Kocoro-lab/Shannon/go/orchestrator/internal/pb/orchestrator";

import "google/protobuf/timestamp.proto";

service StreamingService {
  rpc StreamTaskExecution(StreamRequest) returns (stream TaskUpdate);
}

message StreamRequest {
  string workflow_id = 1;
  repeated string types = 2; // optional filter by event types
  uint64 last_event_id = 3; // resume from this event id (exclusive) - backward compat
  string last_stream_id = 4; // resume from this Redis stream ID (preferred)
}

message TaskUpdate {
  string workflow_id = 1;
  string type = 2;
  string agent_id = 3;
  string message = 4;
  google.protobuf.Timestamp timestamp = 5;
  uint64 seq = 6; // backward compat
  string stream_id = 7; // Redis stream ID for robust resume
}

